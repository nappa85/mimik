<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private history · Mimik</title><script src="/assets/account-sharing.js"></script><link rel="stylesheet" href="/assets/app.css"></head><body><main><a href="/private-sheets/{{ id }}">Current private sheet</a><h1>Full retained history</h1>{% for row in rows %}<article><a href="/private-sheets/{{ id }}/history/{{ row.summary.revision }}">Revision {{ row.summary.revision }}</a> · {{ row.summary.operation }} · {{ row.summary.actor }} · <time data-local-time datetime="{{ row.date.iso }}">{{ row.date.readable }}</time></article>{% endfor %}{% if let Some(after) = next %}<a href="/private-sheets/{{ id }}/history?after={{ after }}">Next page</a>{% endif %}</main></body></html>
