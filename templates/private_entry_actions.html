{% if let Some(actions) = assist %}<div class="entry-actions">{% if let Some(offer) = actions.offer %}<div class="entry-offer"><input type="checkbox" class="offer-dismiss" id="dismiss-{{ actions.key }}" aria-label="Hide the suggestion"><p class="offer-body" id="offer-{{ actions.key }}">Did you mean <bdi>{{ offer.text }}</bdi> = {{ offer.value }}? <button type="submit" form="assist-switch" name="note" value="{{ actions.note }}" id="switch-{{ actions.key }}" aria-labelledby="switch-{{ actions.key }} {{ actions.labelled }}">Yes</button><label for="dismiss-{{ actions.key }}">Hide</label></p></div>{% endif %}{% if let Some(before) = actions.undo %}<p class="entry-undo"><span id="was-{{ actions.key }}">Last change: was {{ before }}</span><button type="submit" form="assist-undo" name="note" value="{{ actions.note }}" id="undo-{{ actions.key }}" aria-labelledby="undo-{{ actions.key }} {{ actions.labelled }}" aria-describedby="was-{{ actions.key }}">Undo</button></p>{% endif %}</div>{% endif %}
