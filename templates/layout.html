<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Mimik{% endblock %}</title><link rel="stylesheet" href="/assets/app.css">{% if !nav.strict %}<script src="/assets/nav.js" defer></script>{% endif %}{% block head %}{% endblock %}</head><body><header class="site"><a class="logo" href="/"{% if nav.home %} aria-current="page"{% endif %}><img src="/assets/logo.png" alt="Mimik home" width="40" height="40"></a>{% if nav.signed_in %}<nav class="menu" aria-label="Main">{% for menu in nav.menus %}<details><summary>{{ menu.label }}</summary><div class="items">{% for item in menu.items %}<a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</div></details>{% endfor %}<details class="account"><summary><span class="visually-hidden">Account: </span>{{ nav.display_name }}</summary><div class="items"><a href="/auth/login">Switch account</a><form method="post" action="/auth/logout"><input type="hidden" name="csrf" value="{{ nav.csrf }}"><button type="submit">Sign out</button></form></div></details></nav>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
