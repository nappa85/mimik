<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server busy · Mimik</title><link rel="stylesheet" href="/assets/app.css"></head><body><main><section class="panel"><h1>Server busy</h1><p role="alert">Server busy: nothing was saved. Your entry is kept below; press Enter again to save it.</p><form method="post" action="{{ action }}"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="base" value="{{ base }}">{% if let Some(null) = null %}<input type="hidden" name="null" value="{{ null }}">{% endif %}<label for="busy-value">Your entry</label>{% if multiline %}<textarea id="busy-value" name="value" rows="6" autofocus>
{{ value }}</textarea>{% else %}<input id="busy-value" name="value" value="{{ value }}" autofocus>{% endif %}<button>Save again</button></form><p><a href="/private-sheets/{{ sheet }}">Back to the sheet</a> (without saving this entry)</p></section></main></body></html>
