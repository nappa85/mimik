name: Deployability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pinned llama.cpp build (ASSIST-33, ASSIST-42): release assets, the test model and the
  # source archive, every hash checked against schemas/llama-runtime-v1.json.
  llama-fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build isolated check environment
        run: docker build -f containers/ci.Dockerfile -t mimik-ci .
      - name: Fetch and verify the pinned runtime, test model and source
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/workspace" -w /workspace \
            mimik-ci python tools/llama_runtime.py fetch --out target/llama-fetch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-fetch
          path: target/llama-fetch/
          if-no-files-found: error

  checks:
    needs: llama-fetch
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llama-fetch
          path: target/llama-fetch
      - name: Build isolated check environment
        run: docker build -f containers/ci.Dockerfile -t mimik-ci .
      - name: Lints, regressions, security, licensing and release inside container
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker run --rm --mount "type=bind,src=$PWD,dst=/workspace" \
            -e REVISION -e CI=1 -e MIMIK_FORMULA_EVAL=/workspace/target/debug/examples/formula_eval \
            mimik-ci bash -euxo pipefail -c '
              cargo fmt --check
              cargo clippy --locked --all-targets --all-features -- -D warnings
              cargo clippy --locked --all-targets -- -D warnings
              ruff check tools
              ruff format --check tools
              cargo test --locked --all-targets --all-features
              cargo build --locked --example formula_eval
              cargo run --locked --example source_fixture -- target/smoke-source
              python -m unittest discover -s tools -p "test_*.py"
              actionlint .github/workflows/ci.yml
              cargo audit --deny warnings
              cargo about generate --locked --fail about.hbs -o target/THIRD-PARTY-NOTICES.md
              cargo build --release --locked
              cargo package --locked --allow-dirty
              python tools/verify_source_package.py target/package/mimik-0.1.0.crate
              cargo vendor --locked target/vendor > target/vendor-config.toml
              python tools/llama_runtime.py verify --dir target/llama-fetch/llama --models target/llama-fetch/models
              python tools/package_release.py --version 0.1.0 --revision "$REVISION"
              cargo test --locked --all-features --lib --no-run --message-format=json > target/test-build.json
              mkdir -p target/confinement
              python -c "import json,shutil; e=[m[\"executable\"] for m in map(json.loads, open(\"target/test-build.json\")) if m.get(\"reason\")==\"compiler-artifact\" and m[\"target\"][\"name\"]==\"mimik\" and m[\"target\"][\"kind\"]==[\"lib\"] and m[\"profile\"][\"test\"]]; assert len(e)==1, e; shutil.copy2(e[0], \"target/confinement/confinement-tests\")"
              cargo build --locked --features dev-endpoint --bin mimik --target-dir target/dev-endpoint
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: |
            target/dist/*.tar.gz
            target/dist/*-source.crate
            target/dist/*-source.tar.gz
            target/dist/SHA256SUMS
          if-no-files-found: error
      # The lib test binary with the confinement and live tests (built in the Ubuntu 22.04
      # image, so it also runs on 24.04); it reads nothing from the source tree.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confinement-tests
          path: target/confinement/confinement-tests
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-smoke-inputs
          path: target/smoke-source/
          if-no-files-found: error
      # A development build (the assistant's dev endpoint), for its browser check only: it is
      # never packaged or released.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-endpoint-binary
          path: target/dev-endpoint/debug/mimik
          if-no-files-found: error

  artifact-smoke:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: release
      - name: Verify and unpack shipped artifact
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          # Every downloaded archive is covered, and the count is the one the release scope states.
          test "$(wc -l < SHA256SUMS)" -eq "$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)"
          test "$(wc -l < SHA256SUMS)" -eq 4
          tar -xzf mimik-0.1.0-linux-x86_64.tar.gz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: synthetic-smoke-inputs
          path: smoke-source
      - name: Run packaged binary from isolated working directory
        run: python3 tools/smoke_release.py release/mimik-0.1.0-linux-x86_64/mimik --source-fixture smoke-source --auth
      - name: Build isolated source-rebuild environment
        run: docker build -f containers/ci.Dockerfile -t mimik-ci .
      - name: Verify corresponding source builds offline without dependency cache
        run: |
          mkdir source-rebuild
          tar -xzf release/mimik-0.1.0-source.crate -C source-rebuild
          tar -xzf release/mimik-0.1.0-dependency-sources.tar.gz -C source-rebuild/mimik-0.1.0
          docker run --rm --network=none --mount "type=bind,src=$PWD/source-rebuild/mimik-0.1.0,dst=/workspace" \
            -e CARGO_HOME=/tmp/empty-cargo mimik-ci cargo build --release --offline --locked

  browser-smoke:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: synthetic-smoke-inputs
          path: smoke-source
      - name: Verify same release archive and unpack
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          tar -xzf mimik-0.1.0-linux-x86_64.tar.gz
      - name: Build isolated Chromium environment
        run: docker build -f containers/browser.Dockerfile -t mimik-browser .
      - name: Offline real-browser verification of shipped binary
        run: |
          docker run --rm --network=none --cpus=2 --memory=4g --shm-size=1g --pids-limit=1024 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD/release/mimik-0.1.0-linux-x86_64/mimik,dst=/app/mimik,readonly" \
            --mount "type=bind,src=$PWD/smoke-source,dst=/fixture,readonly" \
            mimik-browser /app/mimik --source-fixture /fixture --auth
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-endpoint-binary
          path: dev-endpoint
      - name: Offline browser check of the development assistant against a fake model server
        run: |
          chmod 0755 dev-endpoint/mimik
          docker run --rm --network=none --cpus=2 --memory=4g --shm-size=1g --pids-limit=1024 \
            --cap-drop=ALL --security-opt=no-new-privileges --entrypoint python \
            --mount "type=bind,src=$PWD/dev-endpoint/mimik,dst=/app/mimik-dev,readonly" \
            --mount "type=bind,src=$PWD/smoke-source,dst=/fixture,readonly" \
            mimik-browser /checks/assist_model_browser.py /app/mimik-dev --fixture /fixture

  lan-smoke:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: synthetic-smoke-inputs
          path: smoke-source
      - name: Verify and unpack runtime and matching source
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          tar -xzf mimik-0.1.0-linux-x86_64.tar.gz
          mkdir lan-source
          tar -xzf mimik-0.1.0-source.crate -C lan-source
          tar -xzf mimik-0.1.0-dependency-sources.tar.gz -C lan-source/mimik-0.1.0
      - name: Build isolated verification environments
        run: |
          docker build -f containers/ci.Dockerfile -t mimik-ci .
          docker build -f containers/browser.Dockerfile -t mimik-browser .
      - name: Unpacked separate-client LAN and HTTPS proxy acceptance
        run: python3 tools/lan_smoke.py --binary release/mimik-0.1.0-linux-x86_64/mimik --source-root release/lan-source/mimik-0.1.0 --source-fixture smoke-source

  # The pinned llama-server under the real profiles, from the unpacked release, as host steps
  # (Docker's seccomp profile refuses the namespaces bwrap needs). No Rust toolchain.
  llama-runtime:
    needs: [llama-fetch, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llama-fetch
          path: fetched
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: confinement-tests
          path: target
      - name: Verify and unpack the release, reapply the manifest's modes
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mkdir -p target/rel target/models target/scratch
          tar -xzf release/mimik-0.1.0-linux-x86_64.tar.gz -C target/rel --strip-components=1
          cp fetched/models/* target/models/
          python3 tools/llama_runtime.py verify --dir target/rel/llama --models target/models
          chmod 0755 target/rel/mimik target/confinement-tests
      - name: Install bubblewrap (a pinned upstream release if the package lacks an option)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          missing=""
          for option in --unshare-all --die-with-parent --new-session --clearenv --setenv --cap-drop --ro-bind --bind-fd --ro-bind-fd --ro-bind-data --perms --dev --proc --tmpfs --dir --symlink --remount-ro --seccomp --json-status-fd --chdir --size; do
            bwrap --help 2>&1 | grep -q -- "$option " || missing="$missing $option"
          done
          if [ -n "$missing" ]; then
            echo "bubblewrap lacks:$missing; building the pinned upstream 0.13.0"
            sudo apt-get install -y meson ninja-build libcap-dev pkg-config
            curl -fsSL -o bwrap.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.13.0/bubblewrap-0.13.0.tar.xz
            echo "4734237473c0e5d695e4e9034a34e43b2dbf5164655bd13fa59ae376b2b7a765  bwrap.tar.xz" | sha256sum --check
            tar -xJf bwrap.tar.xz
            (cd bubblewrap-0.13.0 && meson setup build --prefix=/usr -Dman=disabled -Dtests=false && ninja -C build && sudo ninja -C build install)
            bwrap --version
          fi
      # Recorded, not gated: what the probe reaches with the runner's AppArmor user-namespace
      # restriction as shipped (level 1 is certified only with it switched off, below).
      - name: Start-time probe with the AppArmor restriction as shipped (recorded)
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "kernel.apparmor_restrict_unprivileged_userns is absent"
          status=0
          target/rel/mimik assistant-runner --probe --runtime target/rel/llama \
            --models-dir target/models --model local:stories260K.gguf \
            --model-sha256 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d \
            --data-dir target/probe-data-restricted || status=$?
          echo "probe exit status with the restriction as shipped: $status (0 means level 1)"
      - name: Allow unprivileged user namespaces for this job only
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is absent"
          fi
          cat /sys/kernel/security/lsm || true
      - name: Flag check of the pinned llama-server
        run: |
          server=target/rel/llama/cpu/llama-server
          expected=$(python3 -c "import json; print(json.load(open('schemas/llama-runtime-v1.json'))['llama_cpp']['version_line'])")
          "$server" --version 2>&1 | grep -qF "$expected"
          help=$("$server" --help 2>&1)
          for flag in --model --alias --host --port --api-key-file --offline --no-webui --no-slots --no-mmproj --jinja --n-gpu-layers --fit --threads --threads-batch --ctx-size --parallel --no-warmup --cache-ram --reasoning --ignore-eos --device --list-devices; do
            grep -qF -- "$flag" <<<"$help" || { echo "llama-server lacks $flag"; exit 1; }
          done
      - name: Start-time probe (exits 0 only at level 1)
        run: |
          target/rel/mimik assistant-runner --probe --runtime target/rel/llama \
            --models-dir target/models --model local:stories260K.gguf \
            --model-sha256 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d \
            --data-dir target/probe-data
      - name: Confinement, endpoint and live tests against the unpacked runtime
        env:
          MIMIK_LIVE_RUNTIME: ${{ github.workspace }}/target/rel/llama
          MIMIK_LIVE_MODELS: ${{ github.workspace }}/target/models
          MIMIK_LIVE_SCRATCH: ${{ github.workspace }}/target/scratch
        run: |
          set -o pipefail
          target/confinement-tests --include-ignored --test-threads=2 \
            assistant::runtime::seccomp:: assistant::runtime::endpoint:: \
            assistant::runtime::runner:: assistant::runtime::launch::live_tests:: \
            2>&1 | tee target/confinement.log
          # A filter that matches too little must not pass: at least the 30 tests of this
          # revision ran, none failed or was ignored.
          ran=$(grep -oE '^test result: ok\. [0-9]+ passed; 0 failed; 0 ignored' target/confinement.log | grep -oE '[0-9]+' | head -n 1)
          if [ "${ran:-0}" -lt 30 ]; then
            echo "only ${ran:-0} confinement tests ran; expected at least 30"
            exit 1
          fi

  deployable:
    name: deployable
    if: ${{ always() }}
    needs: [llama-fetch, checks, artifact-smoke, browser-smoke, lan-smoke, llama-runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fail closed on any failed, cancelled, or skipped prerequisite
        env:
          FETCH: ${{ needs.llama-fetch.result }}
          RUNTIME: ${{ needs.llama-runtime.result }}
          CHECKS: ${{ needs.checks.result }}
          SMOKE: ${{ needs.artifact-smoke.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          LAN: ${{ needs.lan-smoke.result }}
        run: |
          test "$FETCH" = success
          test "$RUNTIME" = success
          test "$CHECKS" = success
          test "$SMOKE" = success
          test "$BROWSER" = success
          test "$LAN" = success
