[package]
name = "mimik"
version = "0.1.0"
edition = "2024"
description = "A sheet-first tabletop RPG companion"
license = "AGPL-3.0-only"
publish = false
include = ["/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/LICENSE", "/logo.png", "/README.md", "/AGENTS.md", "/TODO.md", "/about.toml", "/about.hbs", "/pyproject.toml", "/.env.example", "/.gitignore", "/.dockerignore", "/.github/workflows/*.yml", "/containers/**", "/src/**", "/templates/**", "/assets/*.css", "/assets/*.js", "/assets/*.md", "/assets/htmx-LICENSE", "/assets/response-targets-LICENSE", "/migrations/*.sql", "/tests/*.rs", "/tests/support/*.rs", "/examples/publication_profile.rs", "/examples/qr_decode.rs", "/examples/source_fixture.rs", "/examples/source_reimport_profile.rs", "/examples/sheet-harness-demo/*.md", "/examples/sheet-harness-demo/*.json", "/examples/sheet-harness-demo/*.html", "/schemas/*.json", "/schemas/*.txt", "/tools/*.py", "/tools/*.sh", "/tools/fixtures/**", "/tools/requirements*.txt", "/examples/tool-loop-demo/**", "/docs/**/*.md"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[features]
# Deterministic integration-test rendezvous; excluded from shipping defaults.
auth-test-support = []
# The assistant's development endpoint (step 2c-1): a hand-started llama-server reached
# without an endpoint check. Never enabled in release builds (smoke_release.py checks).
dev-endpoint = []

[dependencies]
async-trait = "0.1"
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core"] }
time = { version = "0.3", features = ["serde", "formatting"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
if-addrs = "=0.15.0"
url = "2"
subtle = "2"
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
getrandom = "=0.4.3"
zeroize = "=1.9.1"
# No `config` feature: Mimik has no askama.toml, and that feature only pulls the unmaintained
# basic-toml (RUSTSEC-2026-0374) into the template derive.
askama = { version = "0.14", default-features = false, features = ["derive", "std", "urlencode"] }
ammonia = "4.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
html2text = "0.17"
mime = "0.3"
regex = "1"
hex = "0.4"
jsonschema = { version = "=0.58.6", default-features = false }
lopdf = { version = "0.45", default-features = false }
png = "0.18"
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
rustix = { version = "1", features = ["fs", "process", "net", "thread", "pipe", "event", "time"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` (also enabled by rig-core): the assistant's schema must reach llama.cpp in
# its pinned key order (step 2c-1), and every JSON object keeps document order.
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
form_urlencoded = "1.2"
sha2 = "0.11"
thiserror = "2"
# Already in the dependency tree (jsonschema); used for display-safety checks of catalogue text.
unicode-general-category = "=1.1.0"
# Already in the dependency tree (url); diacritic folding of the assistant's fraction words.
unicode-normalization = "=0.1.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
cel = { version = "=0.15.0", default-features = false }
# Interpretation assistant (step 2c-1, D-H, ASSIST-39): the provider client; Mimik's own
# body-bounded transport (hyper, below) is under it. No TLS anywhere: plain HTTP only.
rig-core = { version = "=0.45.0", default-features = false }
http = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Model runtime (step 2c-2): the model client's HTTP/1 connection over a stream Mimik opened and
# checked itself (hyper's client connection, no pool, no proxy, no redirects).
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
# The model server's seccomp program, compiled in pure Rust (no libseccomp).
seccompiler = { version = "=0.5.0", default-features = false }
# `/proc` reads of the endpoint check and the pidfile (no default features: no chrono, no flate2).
procfs = { version = "=0.18.0", default-features = false }
# The runner's `execveat` of the verified llama-server descriptor (no safe wrapper exists).
libc = "0.2"

[dev-dependencies]
rqrr = { version = "=0.11.0", default-features = false }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
scraper = { version = "=0.27.0", default-features = false }
tower = { version = "0.5", features = ["util"] }
# Property tests of the lenient number parser (assisted sheet slice 1.1), dev-only.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
strip = true

[[test]]
name = "login_ui"
required-features = ["auth-test-support"]
