[package]
name = "p-rig"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
stub = { path = "../stub" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde_json = "1"
url = "2"
futures-util = "0.3"
rig-core = { version = "=0.45.0", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
http = "1"
bytes = "1"
rig-reqwest = { version = "=0.45.0", default-features = false }
