[package]
name = "p-oai"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
stub = { path = "../stub" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde_json = "1"
url = "2"
futures-util = "0.3"
async-openai = { version = "=0.42.2", default-features = false, features = ["chat-completion", "byot", "middleware"] }
tower = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
http = "1"
bytes = "1"
